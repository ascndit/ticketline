services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ticketline
      POSTGRES_PASSWORD: ticketline
      POSTGRES_DB: ticketline
    ports:
      - "5432:5432"

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=ticketline;Username=ticketline;Password=ticketline
      Jwt__Issuer: ticketline
      Jwt__Audience: ticketline
      Jwt__Key: ticketline-dev-key-not-for-production-use
    depends_on:
      - db
